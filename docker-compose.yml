version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: qfl_hrm_8-app
    container_name: qfl_hrm_8-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - qfl_hrm_8-network


  nginx:
    image: nginx:latest
    container_name: qfl_hrm_8-nginx
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/custom.conf:/etc/nginx/conf.d/custom.conf
    depends_on:
      - app
    networks:
      - qfl_hrm_8-network

networks:
  qfl_hrm_8-network:


